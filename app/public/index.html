<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нотатки — UDC WS8</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Нотатки</h1>
      <label>
        Я увійшов як
        <select id="user">
          <option value="1">Оля</option>
          <option value="2">Тарас</option>
        </select>
      </label>
    </header>

    <main>
      <form id="new-note">
        <div class="field">
          <label for="title">Заголовок</label>
          <input id="title" placeholder="Заголовок" required />
        </div>
        <div class="field">
          <label for="body">Текст</label>
          <input id="body" placeholder="Текст" />
        </div>
        <button type="submit">Додати</button>
      </form>

      <div class="filters" role="group" aria-label="Перегляд нотаток">
        <button type="button" id="filter-active" class="filter-btn" aria-pressed="true">Активні</button>
        <button type="button" id="filter-archived" class="filter-btn" aria-pressed="false">Архів</button>
      </div>

      <ul id="notes"></ul>
      <p id="empty" hidden></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
